<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>TEBORI</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0f1110"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="TEBORI">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1110;--cd:#181b19;--ln:#2a2f2c;--tx:#eef2ee;--mu:#8d968f;--ac:#b6f23a;--bd:#ff7a6b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.45 Sora,system-ui,sans-serif;padding-bottom:96px}
main{max-width:720px;margin:auto;padding:16px}h1{font-size:26px;margin:4px 0 14px;font-weight:800;letter-spacing:.5px}h2{font-size:17px;margin:20px 0 8px}h3{font-size:15px;margin:0 0 6px}
.c{background:var(--cd);border:1px solid var(--ln);border-radius:16px;padding:14px;margin:10px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{grid-template-columns:repeat(3,1fr)}
.s{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:10px}.s b{display:block;font-size:20px;color:var(--ac)}.s span,.mu{color:var(--mu);font-size:12.5px}
label{display:block;font-size:12.5px;color:var(--mu);margin:8px 0 3px}input,select,textarea{width:100%;background:#0f1110;color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:10px;font:inherit}
button,.b{background:var(--ac);color:#0f1110;border:0;border-radius:10px;padding:10px 14px;font:600 14px Sora,sans-serif;cursor:pointer}button.o{background:none;color:var(--tx);border:1px solid var(--ln)}button.o.on{border-color:var(--ac);color:var(--ac)}button.x{background:none;color:var(--bd);padding:4px 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.row>*{flex:0 0 auto}.ch{width:100%;height:auto}.ch text{fill:var(--mu);font-size:10px}
nav{position:fixed;bottom:0;left:0;right:0;background:#0b0d0c;border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:10px 0 8px;font-size:11px}nav button.on{color:var(--ac)}nav i{display:block;font-style:normal;font-size:19px}
.em{text-align:center;padding:18px;color:var(--mu);border:1px dashed var(--ln);border-radius:14px;margin:10px 0}.tg{display:inline-block;font-size:11px;border:1px solid var(--ln);border-radius:20px;padding:2px 8px;color:var(--mu)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ac);color:#0f1110;padding:10px 16px;border-radius:12px;font-weight:600;z-index:9;max-width:90%}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal button{padding:8px 0;background:var(--bg);color:var(--tx);border:1px solid var(--ln);font-weight:400}.cal .f{background:var(--ac);color:#0f1110}.cal .m{background:#4a2420}.cal .r{background:#2a3b4a}
.cmp{position:relative;width:100%;aspect-ratio:3/4;overflow:hidden;border-radius:12px;background:#000}.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.sb{display:flex;gap:8px;overflow-x:auto}.sb img{height:70px;border-radius:8px}
li{margin:3px 0}ul,ol{padding-left:20px;margin:6px 0}.pulse{animation:p .8s 2}@keyframes p{50%{transform:scale(1.06)}}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}
</style></head><body><main id="app"></main><nav id="nav"></nav><div id="tt"></div>
<script>
// ===== Dados (localStorage; trocar por banco/API no futuro) =====
const K='tebori.v1',DEF={profile:null,meas:[],photos:[],ing:[],meals:[],favs:[],hist:[],ex:[],plans:[],att:{},sess:[],seen:0};
let S=Object.assign({},DEF);
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('tebori',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const kv=(m,k,v)=>idb().then(d=>new Promise((ok,no)=>{const t=d.transaction('kv',m=='get'?'readonly':'readwrite'),s=t.objectStore('kv'),q=m=='get'?s.get(k):s.put(v,k);t.oncomplete=()=>ok(q.result);t.onerror=()=>no(t.error)}));
function save(){kv('set',K,S).catch(()=>toast('Não foi possível salvar. Exporte um backup.'))}
async function boot(){try{let v=await kv('get',K);if(!v){try{v=JSON.parse(localStorage.getItem(K))}catch(e){}}S=Object.assign({},DEF,v||{});navigator.storage?.persist?.()}catch(e){}render()}
// Pontos de integração futura (não conectados): IA do Chef, IA de treino, banco, login, storage de imagens
const INTEG={chef:null,treino:null,db:null,auth:null,imagens:null};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n};
const td=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const f1=(n,d=1)=>n==null?'—':n.toFixed(d).replace('.',',');const df=d=>d.slice(8)+'/'+d.slice(5,7);const ts=d=>Date.parse(d+'T12:00:00');
const fd=e=>{e.preventDefault();return Object.fromEntries(new FormData(e.target))};
function toast(m){const t=document.getElementById('tt');t.innerHTML='<div class=toast>'+esc(m)+'</div>';setTimeout(()=>t.innerHTML='',3200)}
let T='home',sub={ev:'med',ch:'gen',tr:'dia',tx:null},R=[],CH={meal:'',fl:{}},CMP={a:null,b:null,mode:'slide',pos:50},EXSEL='';
const go=(t)=>{T=t;render();scrollTo(0,0)},sb=(k,v)=>{sub[k]=v;render()};
const tabs=(k,l)=>`<div class=row>${l.map(([v,n])=>`<button class="o ${sub[k]==v?'on':''}" onclick="sb('${k}','${v}')">${n}</button>`).join('')}</div>`;
const empty=(t,d)=>`<div class=em><b>${t}</b><br>${d}</div>`;
// ===== Cálculos =====
const meas=()=>[...S.meas].sort((a,b)=>a.d.localeCompare(b.d));
function info(){const p=S.profile||{},m=meas(),w=m.filter(x=>x.w!=null);const h=([...m].reverse().find(x=>x.h)||{}).h||num(p.h);
 const cur=w.length?w[w.length-1].w:num(p.cur),st=num(p.start)??(w.length?w[0].w:null),goal=num(p.goal);
 const lost=st!=null&&cur!=null?st-cur:null,rem=goal!=null&&cur!=null?cur-goal:null;
 let pr=null;if(st!=null&&cur!=null&&goal!=null&&st!=goal)pr=Math.max(0,Math.min(100,(st-cur)/(st-goal)*100));
 const bmi=cur&&h?cur/Math.pow(h/100,2):null;return{p,m,w,h,cur,st,goal,lost,rem,pr,bmi}}
function calc(){const i=info(),p=i.p,age=num(p.age);if(!i.cur||!i.h||!age||!p.sex)return null;
 const tmb=10*i.cur+6.25*i.h-5*age+(p.sex=='m'?5:-161),f={sed:1.2,leve:1.375,mod:1.55,int:1.725}[p.act||'sed'],tdee=tmb*f;
 const o=p.obj||'perder',floor=Math.max(tmb,p.sex=='m'?1500:1200);let k=o=='perder'?Math.max(tdee*.85,floor):o=='ganhar'?tdee+250:tdee;
 const pg=Math.round(i.cur*(o=='manter'?1.6:1.8)),fg=Math.round(k*.25/9),cg=Math.max(0,Math.round((k-pg*4-fg*9)/4));return{tmb,tdee,k,pg,fg,cg,f}}
function streak(){let n=0,d=new Date(td()+'T12:00:00');const g=x=>S.att[x.toISOString().slice(0,10)];if(g(d)!='f')d.setDate(d.getDate()-1);
 while(1){const v=g(d);if(v=='f')n++;else if(v!='r')break;d.setDate(d.getDate()-1)}return n}
function attStats(){const t=td(),mo=t.slice(0,7),ent=Object.entries(S.att).filter(([d])=>d.startsWith(mo));const f=ent.filter(e=>e[1]=='f').length,m=ent.filter(e=>e[1]=='m').length;
 const dt=new Date(t+'T12:00:00');dt.setDate(dt.getDate()-dt.getDay());const w0=dt.toISOString().slice(0,10);
 const wk=Object.entries(S.att).filter(([d,v])=>v=='f'&&d>=w0&&d<=t).length;return{f,wk,pct:f+m?Math.round(f/(f+m)*100):null}}
// ===== Gráfico =====
function chart(pts){if(pts.length<2)return'<p class=mu>Registre ao menos 2 pontos para ver o gráfico.</p>';
 const W=320,H=140,p=20,xs=pts.map(a=>a[0]),ys=pts.map(a=>a[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
 const X=v=>p+(x1==x0?0:(v-x0)/(x1-x0))*(W-2*p),Y=v=>H-p-(y1==y0?.5:(v-y0)/(y1-y0))*(H-2*p);
 return`<svg viewBox="0 0 ${W} ${H}" class=ch><path d="${pts.map((a,i)=>(i?'L':'M')+X(a[0]).toFixed(1)+' '+Y(a[1]).toFixed(1)).join('')}" fill="none" stroke="#b6f23a" stroke-width="2.5" stroke-linejoin="round"/>${pts.map(a=>`<circle cx="${X(a[0])}" cy="${Y(a[1])}" r="3" fill="#b6f23a"/>`).join('')}<text x="2" y="12">${f1(y1)}</text><text x="2" y="${H-4}">${f1(y0)}</text></svg>`}
function wser(mode){const w=info().w;if(mode=='dia')return w.map(x=>[ts(x.d),x.w]);const g={};w.forEach(x=>{const d=new Date(x.d+'T12:00:00');let k;if(mode=='mes')k=x.d.slice(0,7)+'-01';else{d.setDate(d.getDate()-d.getDay());k=d.toISOString().slice(0,10)}(g[k]=g[k]||[]).push(x.w)});
 return Object.keys(g).sort().map(k=>[ts(k),g[k].reduce((a,b)=>a+b)/g[k].length])}
function ring(p){const r=52,c=2*Math.PI*r;return`<svg viewBox="0 0 130 130" width="130" class="${p>=100?'pulse':''}"><circle cx="65" cy="65" r="${r}" fill="none" stroke="#2a2f2c" stroke-width="11"/><circle cx="65" cy="65" r="${r}" fill="none" stroke="#b6f23a" stroke-width="11" stroke-linecap="round" stroke-dasharray="${c*(p||0)/100} ${c}" transform="rotate(-90 65 65)"/><text x="65" y="71" text-anchor="middle" fill="#eef2ee" font-size="22" font-weight="700">${Math.round(p||0)}%</text></svg>`}
// ===== Início =====
function home(){const i=info(),a=attStats(),last=i.w[i.w.length-1];let h='<h1>TEBORI</h1>';
 if(!S.profile)h+=`<div class=c><h3>Vamos começar</h3><p class=mu>Preencha seu perfil (peso, meta e altura) para ativar indicadores, gráficos e cálculos.</p><button onclick="go('perfil')">Criar perfil</button></div>`;
 else h+=`<p class=mu>Olá, ${esc(S.profile.name||'')}. Cada registro atualiza seus indicadores.</p>`;
 h+=`<div class=c><h3>Meu progresso</h3><div class=row style="gap:18px">${ring(i.pr)}<div><div class=mu>Meta ${f1(i.goal)} kg</div><div>${i.lost!=null?(i.lost>=0?'Perdeu ':'Ganhou ')+f1(Math.abs(i.lost))+' kg':'Sem dados'}</div><div class=mu>${i.rem!=null?(i.rem>0?'Faltam '+f1(i.rem)+' kg':'Meta alcançada 🎉'):'Defina peso atual e desejado'}</div></div></div></div>
 <form class=c onsubmit="qw(event)"><h3>Registro rápido de peso</h3><div class=row><input name=w placeholder="kg" inputmode=decimal style="width:110px" required><input type=date name=d value="${td()}" style="width:150px"><button>Salvar</button></div></form>
 <div class="g g3"><div class=s><b>${f1(i.cur)}</b><span>Peso atual</span></div><div class=s><b>${f1(i.st)}</b><span>Peso inicial</span></div><div class=s><b>${f1(i.goal)}</b><span>Peso desejado</span></div><div class=s><b>${f1(i.lost)}</b><span>kg perdidos</span></div><div class=s><b>${f1(i.rem)}</b><span>kg para a meta</span></div><div class=s><b>${f1(i.bmi)}</b><span>IMC (referência)</span></div>
 <div class=s><b>${a.wk}</b><span>Treinos na semana</span></div><div class=s><b>${streak()}</b><span>Dias seguidos</span></div><div class=s><b>${a.pct==null?'—':a.pct+'%'}</b><span>Presença no mês</span></div></div>
 <div class=c><span class=mu>Último peso: ${last?f1(last.w)+' kg em '+df(last.d):'nenhum'} · Próximo objetivo: ${i.cur!=null&&i.goal!=null&&i.rem>0?'chegar a '+f1(Math.max(i.goal,Math.floor(i.cur-0.01)))+' kg':'defina uma meta'}</span></div>
 <div class=c><h3>Evolução do peso</h3><div class=row>${['dia','semana','mes'].map(m=>`<button class="o ${sub.tx==m||(!sub.tx&&m=='dia')?'on':''}" onclick="sb('tx','${m}')">${{dia:'Dias',semana:'Semanas',mes:'Meses'}[m]}</button>`).join('')}</div>${chart(wser(sub.tx||'dia'))}</div>
 <p class=mu>O IMC é só uma referência e não é diagnóstico de saúde.</p>`;return h}
function qw(e){const x=fd(e),w=num(x.w);if(!w)return;const i0=info();S.meas.push({id:Date.now(),d:x.d,w});save();const i=info();
 toast(i.pr>=100&&i0.pr<100?'Meta alcançada! Parabéns 🎉':i0.cur!=null&&w<i0.cur?'Peso registrado: menos '+f1(i0.cur-w)+' kg. Siga firme.':'Peso registrado.');render()}
// ===== Evolução =====
const MF=[['w','Peso (kg)'],['h','Altura (cm)'],['ab','Abdômen (cm)'],['ci','Cintura (cm)'],['qu','Quadril (cm)'],['pe','Peito (cm)'],['br','Braços (cm)'],['pn','Pernas (cm)']];
function evo(){let h='<h1>Evolução</h1>'+tabs('ev',[['med','Medidas'],['foto','Minha transformação']]);return h+(sub.ev=='med'?medv():photov())}
function medv(){const m=meas(),i=info();let h=`<form class=c onsubmit="addM(event)"><h3>Nova medição</h3><label>Data</label><input type=date name=d value="${td()}"><div class=g>${MF.map(([k,n])=>`<div><label>${n}</label><input name=${k} inputmode=decimal></div>`).join('')}</div><div class=row><button>Salvar medição</button></div></form>`;
 if(!m.length)return h+empty('Nenhuma medição ainda','Registre peso e medidas para ver diferenças, médias e gráficos.');
 const wk=i.w;if(wk.length>1){const days=(ts(wk[wk.length-1].d)-ts(wk[0].d))/864e5||1,r=(wk[wk.length-1].w-wk[0].w)/days*7;h+=`<div class=c><h3>Médias</h3>Por semana: <b>${f1(r,2)} kg</b> · Por mês: <b>${f1(r*4.345,2)} kg</b><br><span class=mu>Diferença para o 1º registro: ${f1(wk[wk.length-1].w-wk[0].w,1)} kg · Progresso da meta: ${f1(i.pr,0)}%</span></div>`}
 const dif=MF.slice(2).map(([k,n])=>{const a=m.filter(x=>x[k]!=null);return a.length>1?`<li>${n}: ${f1(a[a.length-1][k]-a[0][k])} cm</li>`:''}).join('');if(dif)h+=`<div class=c><h3>Diferença entre medidas (primeira x última)</h3><ul>${dif}</ul></div>`;
 return h+`<h2>Histórico</h2>`+[...m].reverse().map(x=>`<div class=c><b>${df(x.d)}</b> <button class=x onclick="del('meas',${x.id})">remover</button><br><span class=mu>${MF.filter(([k])=>x[k]!=null).map(([k,n])=>n.split(' ')[0]+' '+f1(x[k])).join(' · ')}${x.w&&x.h?' · IMC '+f1(x.w/Math.pow(x.h/100,2)):''}</span></div>`).join('')}
function addM(e){const x=fd(e),o={id:Date.now(),d:x.d};let any=0;MF.forEach(([k])=>{const v=num(x[k]);if(v!=null){o[k]=v;any=1}});if(!any)return toast('Preencha ao menos um campo');S.meas.push(o);save();toast('Medição salva');render()}
const del=(k,id)=>{S[k]=S[k].filter(x=>x.id!=id);save();render()};
function photov(){const ph=[...S.photos].sort((a,b)=>a.d.localeCompare(b.d));let h=`<div class=c><h3>Adicionar foto</h3><p class=mu>As fotos ficam só neste aparelho, sem compartilhamento.</p><label>Data</label><input type=date id=pd value="${td()}"><div class=row><label class=b style="margin:0">📷 Tirar foto<input type=file accept="image/*" capture=environment hidden onchange="addP(this)"></label><label class=b style="margin:0">🖼 Galeria<input type=file accept="image/*" hidden onchange="addP(this)"></label></div></div>`;
 if(ph.length<2)return h+empty(ph.length?'Falta uma foto':'Nenhuma foto ainda','Adicione ao menos duas fotos em datas diferentes para comparar.')+ph.map(p=>`<img src="${p.u}" height=90 style="border-radius:8px">`).join('');
 const set=(a,b)=>{CMP.a=a;CMP.b=b};if(!CMP.a||!ph.find(p=>p.id==CMP.a)||!ph.find(p=>p.id==CMP.b))set(ph[0].id,ph[ph.length-1].id);
 const A=ph.find(p=>p.id==CMP.a),B=ph.find(p=>p.id==CMP.b),opt=v=>ph.map(p=>`<option value=${p.id} ${p.id==v?'selected':''}>${df(p.d)}/${p.d.slice(0,4)}</option>`).join('');
 h+=`<div class=c><h3>Comparar</h3><div class=row><button class=o onclick="cp('first')">Primeira x atual</button><button class=o onclick="cp('prev')">Anterior x atual</button></div><div class=g><div><label>Antes</label><select onchange="CMP.a=this.value;render()">${opt(CMP.a)}</select></div><div><label>Depois</label><select onchange="CMP.b=this.value;render()">${opt(CMP.b)}</select></div></div>
 <div class=row><button class="o ${CMP.mode=='slide'?'on':''}" onclick="CMP.mode='slide';render()">Deslizante</button><button class="o ${CMP.mode=='side'?'on':''}" onclick="CMP.mode='side';render()">Lado a lado</button></div>`;
 h+=CMP.mode=='slide'?`<div class=cmp><img src="${B.u}"><img id=ov src="${A.u}" style="clip-path:inset(0 ${100-CMP.pos}% 0 0)"></div><input type=range min=0 max=100 value=${CMP.pos} oninput="CMP.pos=this.value;ov.style.clipPath='inset(0 '+(100-this.value)+'% 0 0)'"><div class="row mu"><span>Antes ${df(A.d)}</span><span style="margin-left:auto">Depois ${df(B.d)}</span></div>`:`<div class=g><img src="${A.u}" style="width:100%;border-radius:10px"><img src="${B.u}" style="width:100%;border-radius:10px"></div>`;
 return h+`</div><div class=sb>${ph.map(p=>`<div><img src="${p.u}"><br><span class=mu>${df(p.d)}</span> <button class=x onclick="del('photos',${p.id})">×</button></div>`).join('')}</div>`}
const cp=m=>{const ph=[...S.photos].sort((a,b)=>a.d.localeCompare(b.d)),l=ph[ph.length-1];CMP.b=l.id;CMP.a=(m=='first'?ph[0]:ph[ph.length-2]).id;render()};
function addP(inp){const f=inp.files[0];if(!f)return;const d=document.getElementById('pd').value||td(),im=new Image();im.onload=()=>{const s=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
 S.photos.push({id:Date.now(),d,u:c.toDataURL('image/jpeg',.7)});save();toast('Foto salva');render()};im.src=URL.createObjectURL(f)}
// ===== Chef =====
// Estimativas aproximadas por porção, baseadas em valores médios de tabelas gerais (ex.: TACO). Não são exatas.
const RC=[
{id:1,n:'Omelete de legumes',e:'🍳',m:'cafe',t:10,k:260,p:18,c:6,f:18,i:[['ovo','Ovos',2,'un'],['tomate','Tomate',50,'g'],['cebola','Cebola',20,'g'],['queijo','Queijo',20,'g']],s:['Bata os ovos com sal e temperos.','Refogue cebola e tomate por 2 min.','Despeje os ovos, tampe e cozinhe em fogo baixo por 4 min.','Dobre e sirva.']},
{id:2,n:'Panqueca de banana e aveia',e:'🥞',m:'cafe',t:15,k:290,p:12,c:42,f:8,i:[['banana','Banana',1,'un'],['ovo','Ovos',1,'un'],['aveia','Aveia',30,'g'],['canela','Canela',1,'g']],s:['Amasse a banana e misture com ovo e aveia.','Aqueça frigideira antiaderente.','Doure 2 min de cada lado.']},
